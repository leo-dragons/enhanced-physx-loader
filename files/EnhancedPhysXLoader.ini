; Enhanced PhysX Loader for Mirror's Edge - settings
; by leo_dragons
;
; This file lives next to PhysXLoader.dll in "mirrors edge\Binaries".
; Changes take effect the next time the game starts. Delete a line to use its default.

[General]
; 1 = simulate PhysX fluids (glass shards, dust, smoke, sparks) with the multithreaded replacement.
; 0 = let PhysX simulate them on the CPU (original behaviour, very slow without an NVIDIA GPU).
FluidReplacement=1

; 1 = also replace PhysX "SPH" fluids (mist, steam, floor fog) with a multithreaded SPH simulation.
; 0 = leave them to PhysX (original behaviour; can drop to ~10 fps in misty areas).
ReplaceSPH=1

; Worker threads for the fluid replacement. 0 = automatic (half the logical CPUs, up to 8).
; Lower it (e.g. 2-4) if you stream or record while playing.
FluidThreads=0

; Only used when [Cloth] Replace=0 (PhysX's own cloth):
; Cloth on its own thread, in parallel with the rest of the physics (how cloth ran on PhysX hardware).
;   1 = plain cloth (banners, tarps) on its own thread; tearable cloth stays on the main PhysX thread,
;       where it is much cheaper. Recommended.
;   2 = all cloth, including tearable (slower in tearable-cloth rooms; for testing).
;   0 = original behaviour (all cloth on the main PhysX thread).
ClothThread=1

; Only used when FluidReplacement=0: makes PhysX's own fluid collision cheaper by shrinking its
; collision "packets" by this factor (1, 2, 4, 8 or 16) without changing the physics. 1 = off.
NativePacketScale=1

[Cloth]
; 1 = simulate cloth (flags, tarps, tearable plastic) with the loader's own multithreaded solver instead of
;     PhysX's software cloth, which is very slow without an NVIDIA GPU once plastic is torn. 0 = PhysX's cloth.
Replace=1

; 1 = if the game creates a cloth far away from the points it then pins it to, move the whole cloth onto those
;     points on its first frame (safety net; it has never been needed in testing). 0 = off.
StartRefit=1

; 1 = skip cloth-vs-level collision tests that cannot hit (exact same result, much faster once tearable
;     plastic is shot and its pieces spread over the room). 0 = PhysX's original brute-force test.
FastCollision=1

; Cloth solver iterations per physics substep (the game uses 5). Fewer = cheaper but slightly stretchier cloth.
; 0 = keep the game's value. Tearable cloth (plastic sheets you can shoot or run through) is by far the most
; expensive PhysX effect without an NVIDIA GPU; 2-3 makes it much cheaper.
SolverIterations=0
TearableSolverIterations=0

[Logging]
; Everything here is off by default and costs nothing while off. If something goes wrong, the quickest way to
; help: set Troubleshoot=1, play until the problem happens, quit through the game's menu, then send
; EnhancedPhysXLoader.log, EnhancedPhysXLoader_frames.csv and EnhancedPhysXLoader_profile.txt from this folder.
; Set it back to 0 afterwards (the CSV grows large).

; 1 = turn on Log, FrameCsv, Profile, CrashLog and CrashVerbose at once (overrides the lines below).
Troubleshoot=0

; 1 = write EnhancedPhysXLoader.log (startup info, scene, fluid and cloth events). Useful when reporting a problem.
Log=0

; 1 = write EnhancedPhysXLoader_frames.csv with per-frame physics timings. Large file; for diagnostics only.
FrameCsv=0

; 1 = record where PhysX spends its time during heavy frames (> 30 ms) and write
; EnhancedPhysXLoader_profile.txt when the game exits. For diagnosing slowdowns only.
Profile=0

; 1 = if the game crashes, write a short crash report to EnhancedPhysXLoader.log, even when Log=0: what failed
; and in which component, in plain words (for example "inside the AMD graphics driver"). Costs nothing while
; the game runs normally.
CrashLog=1

; 1 = add the technical details to crash reports (exception code, registers, call stack, loaded graphics
; modules). For developers; 0 keeps the report short.
CrashVerbose=0

; 1 = log which cloth functions the game calls (developer tool).
ClothSpy=0
